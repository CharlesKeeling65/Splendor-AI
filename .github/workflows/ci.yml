name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python 3.12+ is a hard constraint: the engine uses
        # typing.override (AGENTS.md - 3.11 raises ImportError despite
        # pyproject declaring >=3.11).
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: |
          uv venv
          uv pip install -e ".[dev]" pytest

      # Note: ruff and mypy come from `.[dev]` (= requirements/development.txt).
      # Re-installing them here unpinned silently overrode that pin and red-ed
      # the gate repo-wide when a new ruff minor shipped extra default rules.
      - name: Lint (ruff) - same command as `make lint`
        run: .venv/bin/ruff check .

      - name: Type check (mypy, new code paths)
        run: |
          .venv/bin/python -m mypy src/splendor/browser \
            src/splendor/agents/our_agents/dqn \
            src/splendor/agents/our_agents/policy_imitation/ppo_selfplay.py \
            src/splendor/agents/our_agents/policy_imitation/bc_training.py \
            src/splendor/splendor/gym/base.py \
            src/splendor/play_web.py \
            src/splendor/remote \
            src/splendor/play_remote.py

      - name: Test (pytest, offline only)
        run: .venv/bin/python -m pytest tests/ -v
