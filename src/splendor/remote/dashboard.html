<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="3XK9Bqj5ZOECDjeDmlGHm7">
<head data-page-node-id="nsgfxy6CYeTpYF9pK8ZwNh">
<meta charset="utf-8" data-page-node-id="Pi1efjwe2yQ4evbxuNi6eJ">
<title>Splendor 部署仪表盘 · 实时胜率</title>
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="ldYcReS0RL7IQCwuf7h3oL">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea; --text: #1f2328;
    --muted: #6b7280; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  header .room a { color: var(--accent); text-decoration: none; }
  header .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
         gap: 16px; padding: 16px 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 10px; padding: 14px 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  #chart-box { position: relative; height: 380px; }
  table.stats { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  table.stats th, table.stats td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  table.stats th { color: var(--muted); font-weight: 500; font-size: 12px; }
  #log { max-height: 420px; overflow-y: auto; font-size: 12.5px; }
  #log .entry { padding: 3px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 8px; }
  #log .time { color: var(--muted); flex: none; }
  #log .entry.discard { background: #fef2f2; }
  #log .entry.warn { color: #b45309; }
  #log .entry .seat { flex: none; font-weight: 600; }
  .definition { color: var(--muted); font-size: 12px; margin-top: 10px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page-node-id="OqmwOL9NK7XEKwzsYlnX7t">
<header data-page-node-id="fLoMz51mZ1Npq2T8Vt860J">
  <h1 data-page-node-id="lMLGc3rlSyNGWMDuhjVn47">璀璨宝石 · 部署仪表盘</h1>
  <span class="room" id="room" data-page-node-id="WGE3QKcupsRKB1Ga8SoaQc"></span>
  <span class="status" id="status" data-page-node-id="eN6eatdQ1AKw2qYrAFr8RS">连接中…</span>
</header>
<main data-page-node-id="cLuRkBBC9sIAj9eqz63g4Q">
  <section class="panel" data-page-node-id="ELnT82yjNkVkrdhnwGtAnI">
    <h2 data-page-node-id="5yW4oCcFuTXoeT94DyWkTw">各座位实时局面胜率（每个操作前 → 后）<span id="game-label" style="color:var(--accent);font-weight:500;margin-left:8px;"></span></h2>
    <div id="chart-box" data-page-node-id="YMW8m7zj1HY2iycxrf77vf"><canvas id="chart" data-page-node-id="1EXEMsG4c80vh131oGpcD9"></canvas></div>
    <p class="definition" data-page-node-id="mURLyABoeKS8AlYpPAmk42">
      胜率定义：在当前可见局面重建的完整引擎状态上，用当前策略自对弈模拟 N 局至终局
      （未知牌库/对手预留按注册表均匀抽样补全），某座位以最高分终局的频率
      （同分按卡数少者 tie-break，仍并列各计 0.5）。图表只显示最近一局，
      x 轴每局从 0 重新计数。每个操作画「前→后」两个点：
      虚线圆点为操作前，实线方块为操作后；灰点表示该步估计失败/降级。
    </p>
  </section>
  <aside data-page-node-id="335uFrb7BcXiedvcmzjzVe">
    <section class="panel" data-page-node-id="laHkGPZtPu5EpZHHZmehFC">
      <h2 data-page-node-id="6q8o44ZCDQRjJZwcQIFHGK">累计战绩</h2>
      <table class="stats" data-page-node-id="uDZhgxFTKSnDRFlVuA3ibG">
        <thead data-page-node-id="RBBDrMqAJ6DLAtlKxJCBw6"><tr data-page-node-id="6786oiK3Gj53upFySD5Owx"><th data-page-node-id="mVE9la99nRnqXrzGiywDPC">座位</th><th data-page-node-id="vJ23psL372OuCkCg9D5iEF">局数</th><th data-page-node-id="tTmHt2Z1hDrGrGiBsr79es">胜/平/负</th><th data-page-node-id="pLQtabZjTRrUSkDjDFJc7U">累计胜率</th></tr></thead>
        <tbody id="stats-body" data-page-node-id="iYlRD73xAl2bsYOeXwMpdv"></tbody>
      </table>
    </section>
    <section class="panel" data-page-node-id="OfqkcCTsVKD2D8bCwlfCAo">
      <h2 data-page-node-id="t5OvBFhGYRN9DeMCyINRKg">实时对局日志</h2>
      <div id="log" data-page-node-id="ufH3XF36Ia7umA0EEZSToA"></div>
    </section>
  </aside>
</main>
<script>
const SEAT_COLORS = ["#2563eb", "#dc2626", "#059669", "#d97706"];
const chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: { datasets: [] },
  options: {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "nearest", intersect: true },
    scales: {
      // x MUST stay "linear": the datasets carry numeric {x, y} points
      // (x = action index, x + 0.5 = same action after it resolved). Chart.js
      // defaults a line chart's x axis to the "category" scale, which only
      // registers *string* labels - numeric x is then read as a category
      // index and, with an empty label array, clamped to range [0, -1]. That
      // silently collapses every point onto x = 0 (no ticks, flat left edge).
      x: { type: "linear", min: 0,
           title: { display: true, text: "局内操作序列（每局从 0 重新计数；同一序号：操作前 → 操作后）" },
           ticks: { precision: 0, maxRotation: 0 } },
      y: { min: 0, max: 100, title: { display: true, text: "局面胜率 %" } }
    },
    plugins: {
      legend: { labels: { boxWidth: 14, font: { size: 11 } } },
      tooltip: {
        callbacks: {
          title: (items) => items[0].raw.meta || "",
          label: (item) => `${item.dataset.label}: ${item.parsed.y.toFixed(1)}%`
        }
      }
    }
  }
});

function iconOf(e) {
  if (e.type === "game_start") return "🏁";
  if (e.type === "game_end") return "🏆";
  if (e.type === "discard") return "🗑️";
  if (e.type === "action") return e.actor && e.actor.startsWith("bot") ? "🤖" : "🧑";
  if (e.type === "parity") return "⚠️";
  return "ℹ️";
}
function fmtGems(gems) {
  const names = { white: "白", blue: "蓝", green: "绿", red: "红", black: "黑", yellow: "金" };
  return Object.entries(gems || {}).map(([c, n]) => `${names[c] || c}×${n}`).join(" ") || "—";
}
function timeOf(e) {
  const d = new Date((e.ts || 0) * 1000);
  return d.toTimeString().slice(0, 8);
}

function renderLog(events) {
  const log = document.getElementById("log");
  log.innerHTML = "";
  for (const e of events.slice(-60).reverse()) {
    const div = document.createElement("div");
    div.className = "entry" + (e.type === "discard" ? " discard" : "")
      + (e.level === "warn" || e.type === "parity" ? " warn" : "");
    let text = "";
    if (e.type === "action") text = `${e.actor} · ${e.desc}`;
    else if (e.type === "discard") text = `座位${e.seat} 弃宝石 ${fmtGems(e.gems)}`;
    else if (e.type === "game_start") text = `对局开始（bot${e.bot} 坐位${e.my_seat}，${e.seats}人局）`;
    else if (e.type === "game_end") text = `bot${e.bot} 终局 ${e.result}（${Object.entries(e.scores || {}).map(([s, v]) => `座${s}:${v}`).join(" ")}）`;
    else if (e.type === "parity") text = `掩码奇偶：${(e.lines || []).join(" | ")}`;
    else text = e.message || "";
    div.innerHTML = `<span class="time">${timeOf(e)}</span><span>${iconOf(e)}</span><span>${text}</span>`;
    log.appendChild(div);
  }
}

function renderStats(events) {
  const perSeat = {};
  const seatOf = {};
  for (const e of events) {
    if (e.type === "game_start") seatOf[`${e.bot}:${e.game}`] = e.my_seat;
    else if (e.type === "game_end") {
      const seat = seatOf[`${e.bot}:${e.game}`];
      if (seat == null) continue;
      const s = perSeat[seat] = perSeat[seat] || { games: 0, win: 0, draw: 0, loss: 0 };
      s.games += 1;
      if (e.result === "win") s.win += 1;
      else if (e.result === "draw") s.draw += 1;
      else if (e.result === "loss") s.loss += 1;
    }
  }
  const tbody = document.getElementById("stats-body");
  tbody.innerHTML = "";
  const seats = Object.keys(perSeat).sort((a, b) => a - b);
  for (const seat of seats.length ? seats : ["-"]) {
    const s = perSeat[seat];
    const rate = s && s.games ? (100 * s.win / s.games).toFixed(0) + "%" : "—";
    const detail = s ? `${s.win}/${s.draw}/${s.loss}` : "—";
    const games = s ? s.games : "—";
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${SEAT_COLORS[(seat - 1 + 4) % 4] || "#999"}"></span> 座位${seat}</td><td>${games}</td><td>${detail}</td><td>${rate}</td>`;
    tbody.appendChild(tr);
  }
}

function renderChart(events) {
  // Per-game x reset: the event files are append-mode across runs and the
  // `game` counter restarts at 1 every run, so "the current game" cannot be
  // keyed by the `game` field alone. Slice the window at the LATEST
  // game_start's timestamp instead - everything before it belongs to a
  // finished game / a previous run and must not bleed into this chart
  // (otherwise a new game would continue on the previous game's x tail).
  const starts = events.filter((e) => e.type === "game_start");
  const lastStart = starts.length ? starts[starts.length - 1] : null;
  const windowEvents = lastStart
    ? events.filter((e) => (e.ts || 0) >= (lastStart.ts || 0))
    : events;
  // Only real action records (stale:false, written by the acting bot itself
  // with both `before` and `after`). The other bot re-logs the same action as
  // an observation with stale:true and after:null - counting those would
  // burn one x index per duplicate and break the before->after pairing.
  const actions = windowEvents.filter((e) => e.type === "action" && !e.stale);
  const label = document.getElementById("game-label");
  label.textContent = lastStart ? `· 第 ${lastStart.game} 局` : "";
  const seatCount = Math.max(2, ...actions.map((e) =>
    Math.max((e.before || []).length, (e.after || []).length)));
  const datasets = [];
  for (let seat = 1; seat <= seatCount; seat++) {
    const color = SEAT_COLORS[(seat - 1) % SEAT_COLORS.length];
    const before = [], after = [];
    // x is the index WITHIN the current game: every new game restarts at 0.
    actions.forEach((e, idx) => {
      const b = (e.before || [])[seat - 1];
      const a = (e.after || [])[seat - 1];
      if (b != null) before.push({ x: idx, y: b * 100,
        meta: `第${e.seq}步 · ${e.actor} · ${e.desc} · 操作前` });
      if (a != null) after.push({ x: idx + 0.5, y: a * 100,
        meta: `第${e.seq}步 · ${e.actor} · ${e.desc} · 操作后` });
    });
    datasets.push({ label: `座位${seat} 操作前`, data: before, borderColor: color,
      backgroundColor: color + "55", borderDash: [4, 3], pointStyle: "circle",
      pointRadius: 2.5, borderWidth: 1, tension: 0.2 });
    datasets.push({ label: `座位${seat} 操作后`, data: after, borderColor: color,
      backgroundColor: color, pointStyle: "rect", pointRadius: 3.5,
      borderWidth: 2, tension: 0.2 });
  }
  chart.data.datasets = datasets;
  chart.update();
}

async function tick() {
  try {
    const res = await fetch("/api/state");
    const state = await res.json();
    document.getElementById("status").textContent =
      `${state.total_events} 条事件 · 更新于 ${new Date().toTimeString().slice(0, 8)}`;
    document.getElementById("room").innerHTML = state.room_url
      ? `房间: <a href="${state.room_url}" target="_blank">${state.room_url}</a>` : "";
    renderChart(state.events);
    renderStats(state.events);
    renderLog(state.events);
  } catch (err) {
    document.getElementById("status").textContent = "连接失败：" + err.message;
  }
}
tick();
setInterval(tick, 1500);
</script>
</body>
</html>
