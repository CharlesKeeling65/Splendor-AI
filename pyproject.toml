[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools" ]

[project]
name = "splendor"
version = "0.0.3"
description = "Splendor Game Engine & automatic agents"
readme = "README.md"
keywords = [
  "AI",
  "Deep Learning",
  "game",
  "Genetic Algorithm",
  "gymnasium",
  "PPO",
  "Recurrent-PPO",
  "Reinforcement Learning",
  "RL",
  "torch",
]
license = { file = "LICENSE" }
maintainers = [
  { name = "roeey777" },
]
authors = [
  { name = "roeey777" },
]
requires-python = ">=3.11"
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation :: Sphinx",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = [ "dependencies", "optional-dependencies" ]

urls.Documentation = "https://roeey777.github.io/Splendor-AI/"
urls.Homepage = "https://roeey777.github.io/Splendor-AI/"
urls.Issues = "https://github.com/roeey777/Splendor-AI/issues"
urls.Repository = "https://github.com/roeey777/Splendor-AI"
scripts.evolve = "splendor.agents.our_agents.genetic_algorithm.evolve:main"
scripts.ppo = "splendor.agents.our_agents.ppo.ppo:main"
scripts.dqn = "splendor.agents.our_agents.dqn.dqn:main"
scripts.dqn-evaluate = "splendor.agents.our_agents.dqn.evaluate:main"
scripts.dqn-monitor = "splendor.agents.our_agents.dqn.monitor:main"
scripts.policy-imitation = "splendor.agents.our_agents.policy_imitation.cli:main"
scripts.task1-pilot = "splendor.agents.our_agents.policy_imitation.pilot_orchestrator:main"
scripts.task1-pilot-monitor = "splendor.pilot_monitor:main"
scripts.play-web = "splendor.play_web:main"
scripts.play-web-remote = "splendor.play_remote:main"
scripts.play-advisor = "splendor.play_advisor:main"
scripts.inference-server = "splendor.remote.server:main"
scripts.play-dashboard = "splendor.remote.dashboard:main"
scripts.splendor-league = "splendor.league:main"
gui-scripts.splendor = "splendor.general_game_runner:main"

[tool.setuptools]
include-package-data = true

# Install all the non-code files as well (pictures and trained agents weights).
[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.dynamic]
dependencies = { file = [ "requirements/runtime.txt" ] }
optional-dependencies = { dev = { file = [
  "requirements/development.txt",
] }, docs = { file = [
  "requirements/docs.txt",
] }, extra = { file = [
  "requirements/extra.txt",
] } }

# External Tools

[tool.ruff]
line-length = 88
exclude = [
  "build",
  "docs",
  "src/splendor/game.py",
  "src/splendor/general_game_runner.py",
  "src/splendor/splendor/splendor.md",
  "src/splendor/splendor/splendor_displayer.py",
  "src/splendor/splendor/splendor_model.py",
  "src/splendor/splendor/splendor_utils.py",
  "src/splendor/splendor/wiki-template/*",
  "src/splendor/template.py",
  "src/splendor/utils.py",
]

# Like Black, indent with spaces, rather than tabs.
format.indent-style = "space"
# Like Black, use double quotes for strings.
format.quote-style = "double"
# Like Black, automatically detect the appropriate line ending.
format.line-ending = "auto"
# Like Black, respect magic trailing commas.
format.skip-magic-trailing-comma = false
lint.select = [
  "A",    # use flake8-builtins
  "ANN",  # use flake8-annotations
  "B",    # use flake8-bugbear
  "C",
  "C4",   # use flake8-comprehensions
  "COM",  # use flake8-commas
  "F",    # use pyflakes
  "FURB", # use refurb
  "I",    # use isort
  "PL",   # use pylint
  "PTH",  # use flake8-use-pathlib
  "Q",    # use flake8-quotes
  "RUF",  # use ruff-specific rules
  "SLF",  # use flake8-self
  "UP",   # use pyupgrade
]
lint.ignore = [
  "ANN002", # ignore ANN002 - Missing type annotation for *args.
  "ANN003", # ignore ANN003 - Missing type annotation for **kwargs.
  "ANN101", # ignore ANN101 - Missing type annotation for self in method.
  "COM812", # ignore COM812 - Trailing comma missing.
  "F722",   # ignore F722   - Syntax error in forward annotation due to lack of integration between jaxtyping and ruff.
  # PLC2701 (private-name import) is a deliberate, repo-wide test idiom: the
  # offline suites reach for module-private helpers on purpose
  # (_status_from_body, _coordinate_room, _index_of, ...) because those are the
  # units under test. Ignoring it here replaces the scattered inline noqas -
  # which ruff reports as "unused" outside preview mode, making the directive
  # simultaneously required and dead depending on the invocation.
  "PLC2701",
  # RUF001/002/003 flag CJK full-width punctuation as "ambiguous" (， vs ,,
  # （ vs (). In this repo those characters are load-bearing content, not
  # typos: the web game's turn-status grammar is literally
  # "等待你丢弃多余宝石（每人最多持有10个）", and the extractor must match it
  # byte-for-byte. Disabling the rule here is the only correct fix.
  "RUF001",
  "RUF002",
  "RUF003",
]
lint.unfixable = [ "F401" ]
lint.flake8-builtins.builtins-allowed-modules = [ "random", "types" ]

# Tests legitimately compare against literal constants (deck sizes, tuple
# lengths) and skip boilerplate return annotations.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [ "ANN201", "ANN202", "PLR2004", "PLC0415" ]
# PLR0914 ("too many locals") and PLR0917 ("too many positional arguments") are
# preview-gated: `ruff check --select PLR0917` answers "no effect because
# preview is not enabled", so they can NOT be turned on for the stable CI
# invocation. The deployment harness nonetheless suppresses them, per repo
# style, which makes its `# noqa` simultaneously required (under `--preview`)
# and dead (under the gate) - and RUF100 then reports the dead half.
# Rather than police comment hygiene on a line whose right answer depends on
# how ruff was invoked, RUF100 is off for this one file. Add a file here only
# if a stable-invocation lint error would otherwise be unfixable.
"src/splendor/play_remote.py" = [ "RUF100" ]

[tool.mypy]
plugins = [ "numpy.typing.mypy_plugin" ]
disable_error_code = [ "import-untyped" ]
exclude = [
  "^.*build.*\\.py$",
  "^docs.*\\.py$",
]
